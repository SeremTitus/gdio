name: gdio Secure Export Pipeline

on:
  workflow_dispatch:

env:
  GODOT_TAG: "{tag}"
  CSHARP: "{csharp_bool}"
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}
  ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_windows: ${{ steps.check.outputs.has_windows }}
      has_linux: ${{ steps.check.outputs.has_linux }}
      has_macos: ${{ steps.check.outputs.has_macos }}
      has_web: ${{ steps.check.outputs.has_web }}
      has_android: ${{ steps.check.outputs.has_android }}
      has_ios: ${{ steps.check.outputs.has_ios }}
      has_visionos: ${{ steps.check.outputs.has_visionos }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect platforms from export presets
        id: check
        shell: bash
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "No export_presets.cfg found."
            for p in has_windows has_linux has_macos has_web has_android has_ios has_visionos; do
              echo "$p=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          has_windows=false; has_linux=false; has_macos=false
          has_web=false; has_android=false; has_ios=false; has_visionos=false
          while IFS= read -r line; do
            val="${line#*\"}"; val="${val%\"*}"
            case "$val" in
              "Windows"|"Windows Desktop") has_windows=true ;;
              "Linux"|"Linux/X11") has_linux=true ;;
              "macOS"|"Mac OSX") has_macos=true ;;
              "Web"|"HTML5") has_web=true ;;
              "Android") has_android=true ;;
              "iOS") has_ios=true ;;
              "visionOS") has_visionos=true ;;
            esac
          done < <(grep '^platform=' export_presets.cfg)
          echo "has_windows=$has_windows" >> "$GITHUB_OUTPUT"
          echo "has_linux=$has_linux" >> "$GITHUB_OUTPUT"
          echo "has_macos=$has_macos" >> "$GITHUB_OUTPUT"
          echo "has_web=$has_web" >> "$GITHUB_OUTPUT"
          echo "has_android=$has_android" >> "$GITHUB_OUTPUT"
          echo "has_ios=$has_ios" >> "$GITHUB_OUTPUT"
          echo "has_visionos=$has_visionos" >> "$GITHUB_OUTPUT"

  secure-export-windows:
    needs: detect
    if: needs.detect.outputs.has_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hex characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Install gdio
        shell: pwsh
        run: curl.exe -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.ps1 | powershell -Command -

      - name: Add gdio to PATH
        shell: pwsh
        run: echo "$env:LOCALAPPDATA\gdio\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\uben2\cache
            godot\.scons_cache
          key: scons-windows-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-windows-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/windows-editor/
          key: editor-windows-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-windows-${{ env.GODOT_TAG }}

      - name: Cache export templates
        id: template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/windows-templates/
          key: templates-windows-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-windows-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          pip install scons

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          if [ -n "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            gdio builder secure --key "$SCRIPT_AES256_ENCRYPTION_KEY"
          else
            gdio builder secure
          fi

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/windows-editor/* godot/bin/ 2>/dev/null || true

      - name: Build Windows editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder ${{ env.CSHARP == 'true' && '--csharp' || '' }} d3d12=no vulkan=no
          mkdir -p ~/.cache/gdio/windows-editor/
          cp bin/godot.windows.editor.x86_64*.exe ~/.cache/gdio/windows-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/windows-editor/GodotSharp
          fi

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          WINDOWS_EDITOR=${{ env.CSHARP == 'true' && 'godot.windows.editor.x86_64.mono.exe' || 'godot.windows.editor.x86_64.exe' }}
          echo "windows_editor=$(find godot/bin -maxdepth 1 -name "$WINDOWS_EDITOR" -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.windows_editor }}" package_editor/

      - name: Copy GodotSharp
        if: env.CSHARP == 'true'
        shell: bash
        run: |
          if [ -d "godot/bin/GodotSharp" ]; then
            cp -a godot/bin/GodotSharp package_editor/GodotSharp
          fi

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(find package_editor -maxdepth 1 -type f -name "*.exe" | head -n 1)
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"
          gdio addons sync

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi

      # Windows: build templates, install, export
      - name: Build Windows templates (all arch, regular + console)
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --windows --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export Windows presets
        run: gdio build --windows
        continue-on-error: true

      - name: Package artifacts
        if: always()
        run: python .github/workflows/ci_package.py exported_on_windows

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_windows
          path: exported_on_windows/
          if-no-files-found: warn

  secure-export-linux:
    needs: detect
    if: needs.detect.outputs.has_linux == 'true' || needs.detect.outputs.has_web == 'true' || needs.detect.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hexadecimal characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Install gdio
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.sh | bash

      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~/.scons_cache
            godot/.scons_cache
          key: scons-linux-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-linux-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/linux-editor/
          key: editor-linux-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-linux-${{ env.GODOT_TAG }}

      - name: Cache Linux templates
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/linux-templates/
          key: templates-linux-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-linux-${{ env.GODOT_TAG }}

      - name: Cache Web templates
        id: web-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/web-templates/
          key: templates-web-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-web-${{ env.GODOT_TAG }}

      - name: Cache Android templates
        id: android-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/android-templates/
          key: templates-android-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-android-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons pkg-config python3 python3-pip \
            mingw-w64 clang zip unzip curl git cmake openjdk-17-jdk \
            g++-multilib gcc-multilib
          sudo update-alternatives \
            --install /usr/bin/x86_64-w64-mingw32-g++ x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix 100
          sudo update-alternatives \
            --install /usr/bin/x86_64-w64-mingw32-gcc x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix 100

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          if [ -n "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            gdio builder secure --key "$SCRIPT_AES256_ENCRYPTION_KEY"
          else
            gdio builder secure
          fi

      - name: Install Godot build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder install

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/linux-editor/* godot/bin/ 2>/dev/null || true

      - name: Build temporary Linux editor for .NET glue
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          cd godot
          gdio builder ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Generate .NET glue
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          EDITOR=$(find godot/bin -maxdepth 1 -type f -name "godot.linuxbsd.editor.x86_64.mono" | head -n 1)
          chmod +x "$EDITOR"
          "$EDITOR" --headless --generate-mono-glue godot/modules/mono/glue

      - name: Configure local Godot NuGet source
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/godot-nuget"
          dotnet nuget remove source GodotLocal >/dev/null 2>&1 || true
          dotnet nuget add source "$HOME/godot-nuget" --name GodotLocal

      - name: Build Linux editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder ${{ env.CSHARP == 'true' && '--csharp' || '' }} vulkan=no
          mkdir -p ~/.cache/gdio/linux-editor/
          cp bin/godot.linuxbsd.editor.x86_64* ~/.cache/gdio/linux-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/linux-editor/GodotSharp
          fi

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          LINUX_EDITOR=${{ env.CSHARP == 'true' && 'godot.linuxbsd.editor.x86_64.mono' || 'godot.linuxbsd.editor.x86_64' }}
          LINUX_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.linuxbsd.template_release.x86_64.mono' || 'godot.linuxbsd.template_release.x86_64' }}
          WEB_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.web.template_release.wasm32.mono' || 'godot.web.template_release.wasm32' }}
          ANDROID_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.android.template_release.arm64.mono' || 'godot.android.template_release.arm64' }}
          echo "linux_editor=$(find godot/bin -maxdepth 1 -name "$LINUX_EDITOR" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "linux_template=$(find godot/bin -maxdepth 1 -name "$LINUX_TEMPLATE" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "web_template=$(find godot/bin -maxdepth 1 -name "$WEB_TEMPLATE*" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "android_template=$(find godot/bin -maxdepth 1 -name "$ANDROID_TEMPLATE*" -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.linux_editor }}" package_editor/
          chmod +x package_editor/*

      - name: Copy GodotSharp
        if: env.CSHARP == 'true'
        shell: bash
        run: |
          if [ -d "godot/bin/GodotSharp" ]; then
            cp -a godot/bin/GodotSharp package_editor/GodotSharp
          fi

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(find package_editor -maxdepth 1 -type f -executable | head -n 1)
          chmod +x "$EDITOR_BIN"
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"
          gdio addons sync

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi

      # Linux: build templates, install, export
      - name: Build Linux release templates (all arch)
        if: steps.linux-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_linux == 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --linux --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export Linux presets
        if: needs.detect.outputs.has_linux == 'true'
        run: gdio build --linux
        continue-on-error: true

      # Web: setup dependencies, build templates, install, export
      - name: Setup Emscripten SDK
        if: steps.web-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -e
          if [ ! -d "$HOME/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Web release templates (all variants)
        if: steps.web-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh" 2>/dev/null
          cd godot
          gdio builder templates --web --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export Web presets
        if: needs.detect.outputs.has_web == 'true'
        run: gdio build --web
        continue-on-error: true

      # Android: setup dependencies, build templates, install, export
      - name: Validate Android keystore secrets
        id: android_keystore
        if: needs.detect.outputs.has_android == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ANDROID_KEYSTORE"
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEYSTORE_USER"
          MISSING=0
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "::error::ANDROID_KEYSTORE secret is not set."
            MISSING=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is not set."
            MISSING=1
          fi
          if [ -z "${ANDROID_KEYSTORE_USER:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_USER secret is not set."
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::One or more Android keystore secrets are missing. Skipping Android build."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/android_release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/android_debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/android_release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/android_debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEYSTORE_USER" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$ANDROID_KEYSTORE_USER" >> "$GITHUB_ENV"
          echo "has_android_keystore=true" >> "$GITHUB_OUTPUT"
          echo "[OK] Android keystore secrets validated and env vars set."

      - name: Setup Android SDK/NDK
        if: >-
          steps.android-cache.outputs.cache-hit != 'true' &&
          needs.detect.outputs.has_android == 'true' &&
          steps.android_keystore.outputs.has_android_keystore == 'true'
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          if [ ! -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME"
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools-tmp"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools-tmp/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$ANDROID_HOME/cmdline-tools-tmp" cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build Android release template
        if: >-
          steps.android-cache.outputs.cache-hit != 'true' &&
          needs.detect.outputs.has_android == 'true' &&
          steps.android_keystore.outputs.has_android_keystore == 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --android --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export Android presets
        if: >-
          needs.detect.outputs.has_android == 'true' &&
          steps.android_keystore.outputs.has_android_keystore == 'true'
        run: gdio build --android
        continue-on-error: true

      - name: Package artifacts
        if: always()
        run: python .github/workflows/ci_package.py exported_on_linux

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_linux
          path: exported_on_linux/
          if-no-files-found: warn

  secure-export-macos:
    needs: detect
    if: needs.detect.outputs.has_macos == 'true' || needs.detect.outputs.has_ios == 'true' || needs.detect.outputs.has_visionos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hex characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/SCons
            godot/.scons_cache
          key: scons-macos-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-macos-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/macos-editor/
          key: editor-macos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-macos-${{ env.GODOT_TAG }}

      - name: Cache macOS templates
        id: macos-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/macos-templates/
          key: templates-macos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-macos-${{ env.GODOT_TAG }}

      - name: Cache iOS templates
        id: ios-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/ios-templates/
          key: templates-ios-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-ios-${{ env.GODOT_TAG }}

      - name: Cache visionOS templates
        id: visionos-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/visionos-templates/
          key: templates-visionos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-visionos-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install scons python3

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          if [ -n "$SCRIPT_AES256_ENCRYPTION_KEY" ]; then
            gdio builder secure --key "$SCRIPT_AES256_ENCRYPTION_KEY"
          else
            gdio builder secure
          fi

      - name: Install Godot build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder install

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/macos-editor/* godot/bin/ 2>/dev/null || true

      - name: Build macOS editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder ${{ env.CSHARP == 'true' && '--csharp' || '' }} vulkan=no
          mkdir -p ~/.cache/gdio/macos-editor/
          cp bin/godot.macos.editor.arm64* ~/.cache/gdio/macos-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/macos-editor/GodotSharp
          fi

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          echo "macos_editor=$(find godot/bin -maxdepth 1 -name 'godot.macos.editor.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "macos_template=$(find godot/bin -maxdepth 1 -name 'godot.macos.template_release.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "ios_template=$(find godot/bin -maxdepth 1 -name 'godot.ios.template_release.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "visionos_template=$(find godot/bin -maxdepth 1 -name 'godot.visionos.template_release.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.macos_editor }}" package_editor/
          chmod +x package_editor/*

      - name: Install gdio
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.sh | bash

      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(ls package_editor/* 2>/dev/null | head -n 1)
          chmod +x "$EDITOR_BIN"
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"
          gdio addons sync

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi

      # macOS: build templates, install, export
      - name: Build macOS release templates (all arch)
        if: steps.macos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --macos --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export macOS presets
        if: needs.detect.outputs.has_macos == 'true'
        run: gdio build --macos
        continue-on-error: true

      # iOS: build templates, install, export
      - name: Build iOS release template
        if: steps.ios-template-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_ios == 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --ios --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export iOS presets
        if: needs.detect.outputs.has_ios == 'true'
        run: gdio build --ios
        continue-on-error: true

      # visionOS: build templates, install, export
      - name: Build visionOS release template
        if: steps.visionos-template-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_visionos == 'true'
        shell: bash
        run: |
          cd godot
          gdio builder templates --visionos --release ${{ env.CSHARP == 'true' && '--csharp' || '' }}

      - name: Export visionOS presets
        if: needs.detect.outputs.has_visionos == 'true'
        run: gdio build --visionos
        continue-on-error: true

      - name: Package artifacts
        if: always()
        run: python .github/workflows/ci_package.py exported_on_macos

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_macos
          path: exported_on_macos/
          if-no-files-found: warn
