name: "\U0001F41B Bug report"
description: Report a bug or unexpected behavior
labels: [bug]
title: "[BUG]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected
      placeholder: "Example: When I run `gdio build`, it crashes with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Run `gdio ...`
        2. Do something...
        3. See error
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: gdio version
      description: What version of gdio are you using? Run `gdio -v`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: What terminal are you using?
      placeholder: "PowerShell, iTerm2, sh, ghostty"
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Drag and drop any relevant screenshots or log files
    validations:
      required: false
      accept: ".png,.jpg,.gif,.log,.txt,.mp4"
