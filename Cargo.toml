[package]
name = "gdio"
version = "0.1.0"
edition = "2024"
description = "CLI tool for managing Godot Engine projects, editors and templates"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false