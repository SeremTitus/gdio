[package]
name = "gdio"
version = "0.1.0"
edition = "2024"
description = "CLI tool for managing Godot Engine projects, editors and templates"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
zip = "2"
tokio = { version = "1", features = ["full"] }
console = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false